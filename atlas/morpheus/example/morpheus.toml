# The tier's own morpheus rules, read by the filter from origin/<base>. Change it by PR, like a page.
# Every user who dreams this tier gets these; their own config can add deny patterns, not remove them.

model = "any model your org allows for org-wide data"   # a hint the skill shows; nothing enforces it
index_max_lines = 60                                    # check.py's limit for INDEX.md
# Python regular expressions. A session or file that matches one anywhere is dropped before the model runs.
deny = [
  "/srv/finance",
  "(?i)\\bpayroll\\b",
]
